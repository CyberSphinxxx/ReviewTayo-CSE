# Shared subflow: a clean install onboarded as Professional, on Home.
# Run with `runFlow: file: _onboard-professional.yaml`.
appId: com.reviewtayo.cse
---
- launchApp:
    clearState: true
- assertVisible:
    id: 'onboarding-step-account'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-level'
- tapOn:
    id: 'track-professional'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-starting-point'
- tapOn:
    id: 'starting-point-beginner'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-schedule'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-goal'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-plan'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-preferences'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'onboarding-step-done'
- tapOn:
    id: 'onboarding-primary'
- assertVisible:
    id: 'screen-home'
