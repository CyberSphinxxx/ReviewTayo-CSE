/* ---------- settings / enhanced practice ---------- */
function applyTheme(mode){S.theme=mode;const root=document.documentElement;if(mode==='device')root.removeAttribute('data-theme');else root.setAttribute('data-theme',mode)}
function settings(){sheet(`<div class="settings-panel"><div class="top"><button class="x" onclick="sheet('')">✕</button><div><div class="eyebrow">Settings</div><h1 class="serif" style="font-size:32px;font-weight:400">ReviewTayo: CSE</h1></div></div>
<label class="form-label">Appearance</label><div class="theme-seg">${['device','light','dark'].map(x=>`<button class="${S.theme===x?'sel':''}" onclick="applyTheme('${x}');settings()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="theme-note">Dark mode uses the Claude-inspired burgundy palette. Light mode keeps ReviewTayo's cream and maroon identity.</div>
<div class="settings-panel"><button class="settings-row" onclick="toggleLevel()"><div><b>CSE level</b><small>${S.level}</small></div><span class="chev">›</span></button>
<button class="settings-row" onclick="editDate()"><div><b>Target exam date</b><small>${S.examDate||'Not set'}</small></div><span class="chev">›</span></button>
<button class="settings-row" onclick="editGoal()"><div><b>Daily question goal</b><small>${S.goal} questions</small></div><span class="chev">›</span></button>
<button class="settings-row" onclick="toast('Study reminders · prototype')"><div><b>Study reminders</b><small>${S.reminders?'On':'Off'}</small></div><span class="chev">›</span></button>
<div class="form-label">Prototype tools</div><button class="settings-row" onclick="startOnboarding()"><div><b>Run onboarding demo</b><small>Preview the full guided setup</small></div><span class="chev">›</span></button></div></div>`)}
function toggleLevel(){S.level=S.level==='Professional'?'Sub-Professional':'Professional';toast(`Switched to ${S.level}`);settings()}
function editDate(){sheet(`<div class="top"><button class="x" onclick="settings()">←</button><div><div class="eyebrow">Exam date</div><h1 class="serif" style="font-size:30px;font-weight:400">When is your exam?</h1></div></div><label class="form-label" for="examDateInput">Target date</label><input id="examDateInput" class="field" type="date" value="${S.examDate||''}"><button class="cta mar" style="width:100%;justify-content:center" onclick="saveDate()">Save date</button>`) }
function saveDate(){const v=$('#examDateInput').value;S.examDate=v;if(v){const d=Math.ceil((new Date(v+'T12:00:00')-new Date())/86400000);S.days=Math.max(0,d)}settings()}
function editGoal(){sheet(`<div class="top"><button class="x" onclick="settings()">←</button><div><div class="eyebrow">Daily goal</div><h1 class="serif" style="font-size:30px;font-weight:400">Questions per day</h1></div></div><div class="goalgrid" style="margin-top:24px">${[5,10,20].map(n=>`<button class="goal ${S.goal===n?'sel':''}" onclick="S.goal=${n};settings()"><b>${n}</b><small>questions</small></button>`).join('')}</div>`) }
function timedPractice(){toast('Timed mode · 8 minutes');drill()}
function morePractice(){sheet(`<div class="top"><button class="x" onclick="sheet('')">✕</button><div><div class="eyebrow">More practice</div><h1 class="serif" style="font-size:32px;font-weight:400">Choose a mode</h1></div></div><div class="mini-grid"><button class="mini-card" onclick="drill()"><b>Random ${N}</b><small>Fresh mixed set</small></button><button class="mini-card" onclick="customQuiz()"><b>Build a Quiz</b><small>Choose question count</small></button><button class="mini-card" onclick="toast('Mastery Rounds · prototype');drill()"><b>Mastery Rounds</b><small>Difficulty rises with you</small></button></div>`)}

function customStart(n){Q=shuf(BANK).slice(0,Math.min(n,BANK.length));qi=0;right=0;ask()}
function subjectPractice(){sheet(`<div class="top"><button class="x" onclick="sheet('')">✕</button><div><div class="eyebrow">Practice by subject</div><h1 class="serif" style="font-size:32px;font-weight:400">Choose a subject</h1></div></div><div class="subject-menu">${subs().map(([name,p])=>`<button class="row" onclick="toast('${name} practice');drill()"><div><b>${name}</b><small>${p}% recent accuracy</small></div><span class="chev">›</span></button>`).join('')}</div>`)}
function mockExam(resume=false){const total=S.level==='Professional'?170:165,time=S.level==='Professional'?'3h 10m':'2h 40m';sheet(`<div class="top"><button class="x" onclick="sheet('')">✕</button><div class="eyebrow">Mock Exam</div></div><div class="mock-hero"><div class="serif">${S.level}</div><p>${resume?`Resume from ${S.mockProgress}/${total}`:'Full exam simulation'}</p><div class="mock-facts"><div class="mock-fact"><b>${total}</b><small>items</small></div><div class="mock-fact"><b>${time}</b><small>time</small></div><div class="mock-fact"><b>1</b><small>attempt</small></div></div></div><button class="cta mar" style="width:100%;justify-content:center" onclick="mockResult()">${resume?'Resume sample':'Start sample mock'}</button><button class="ghost" onclick="sheet('')">Not now</button>`)}

/* ---------- drill ---------- */
let Q=[],qi=0,right=0;
function drill(){Q=shuf(BANK).slice(0,N);qi=0;right=0;ask()}
function daily(){Q=[shuf(BANK)[0]];qi=0;right=0;ask()}
function ask(){const q=Q[qi];
sheet(`<div class="top"><button class="x" onclick="sheet('');go(S.tab)">✕</button><div class="seg">${Q.map((_,i)=>`<i class="${i<qi?'f':''}"></i>`).join('')}</div></div>
<div class="eyebrow" style="margin-top:26px">${q.c}</div><h1 class="q serif" style="margin-top:8px">${q.q}</h1>
<div>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)"><span>${'ABCD'[i]}</span>${o}</button>`).join('')}</div><div id="fbx" style="display:contents"></div>`)}
function pick(i,el){const q=Q[qi],ok=i==q.a,os=document.querySelectorAll('.opt');
os.forEach((b,k)=>{b.disabled=true;if(k==q.a)b.classList.add('right');else if(k==i)b.classList.add('wrong')});
M[q.c]=Math.max(0,Math.min(3,M[q.c]+(ok?1:-1)));if(ok)right++;S.done++;
const last=qi==Q.length-1,lv=LV[M[q.c]];
$('#fbx').innerHTML=`<div class="fb ${ok?'good':'bad'}"><h3 class="serif">${ok?'Correct':'Not quite.'}</h3>
<p>${ok?'':`Correct answer: <b>${'ABCD'[q.a]}</b>. `}${q.e}</p><div style="margin-bottom:14px"><b>${q.c}</b> <span class="badge lv-${lv}">${lv}</span></div>
<button class="cta mar" style="margin:0;width:100%;justify-content:center" onclick="next()">${last?'Finish':'Next'}</button>
${ok?'':'<button class="ghost" onclick="similar()">Try another like this</button><button class="ghost" style="padding-top:0;color:var(--mute)" onclick="toast(\'Concept page · full build\')">Review concept</button>'}</div>`}
function next(){qi++;qi<Q.length?ask():done()}
function similar(){const c=Q[qi].c,pool=BANK.filter(b=>b.c==c&&b.q!=Q[qi].q);Q.splice(qi+1,0,pool[0]||shuf(BANK)[0]);next()}
function done(){const n=Q.length,one=n==1;if(one)S.dailyDone=true;if(!S.streakDone){S.streakDone=true;S.streak++}
sheet(`<div class="center"><div class="bounce" style="display:inline-block">${owl(130)}</div><h1 class="serif" style="font-size:36px;font-weight:400;margin:20px 0 8px">${one?'Nice one.':'You’re done for today.'}</h1>
<p style="color:var(--mute)">${right} of ${n} correct · ${S.streak}-day streak<br>${one?'Your Daily Question is checked off.':'Come back tomorrow. Your brain files things while you rest.'}</p>
<button class="cta mar" onclick="sheet('');go('home')">Back to Home</button></div>`)}

/* ---------- flashcards ---------- */
let cq=[],ct=0,fl=false;
function flash(){if(!S.rev)return toast('Nothing due. Nice!');cq=CARDS.map((_,i)=>i);ct=cq.length;fl=false;card()}
function card(){if(!cq.length){S.rev=Math.max(0,S.rev-ct);return sheet(`<div class="center">${owl(110)}<h1 class="serif" style="font-size:34px;font-weight:400;margin:18px 0 8px">${S.rev?'Nice work.':'Review cleared.'}</h1><p style="color:var(--mute)">${S.rev?S.rev+' items are saved for later.':'Next items are due tomorrow.'}</p><button class="cta mar" onclick="sheet('');go('${S.tab}')">Done</button></div>`)}
const c=CARDS[cq[0]];sheet(`<div class="top"><button class="x" onclick="sheet('');go(S.tab)">✕</button><div class="seg">${CARDS.map((_,i)=>`<i class="${i<ct-cq.length?'f':''}"></i>`).join('')}</div></div>
<div class="flash serif ${fl?'back':''}" onclick="fl=!fl;card()">${fl?c[1]:c[0]}</div><p style="text-align:center;color:var(--mute)">${fl?'':'Tap to reveal'}</p>
<div class="two" style="margin-top:auto"><button class="again" onclick="cq.push(cq.shift());fl=false;card()">Again</button><button class="got" onclick="cq.shift();fl=false;card()">Got it</button></div>`)}

/* ---------- onboarding v2 ---------- */
let ob=0,obDraft=null;
const DAYS=['M','T','W','T','F','S','S'];
function startOnboarding(){ob=0;obDraft={account:'guest',level:S.level,start:S.start==='Just starting'?'beginner':S.start==='Practice-ready'?'practice':'reviewing',examDate:S.examDate||'',studyDays:[0,2,4,5],session:S.session||'Regular',goal:S.goal,appearance:S.theme,textSize:'standard',reminders:S.reminders};renderOb()}
function obHeader(){return `<div class="ob-brand"><button class="ob-back" onclick="${ob?`ob--;renderOb()`:`settings()`}">${ob?'← Back':' '}</button><strong>🦉 ReviewTayo: CSE</strong><button class="ob-close" onclick="settings()">×</button></div><div class="ob-step">Step ${ob+1} of 8</div><div class="ob-progress">${Array.from({length:8},(_,i)=>`<i class="${i<=ob?'on':''}"></i>`).join('')}</div>`}
function renderOb(){const d=obDraft;let body='';
if(ob===0)body=`<h1 class="ob-title serif">Keep your progress?</h1><p class="ob-copy">Choose how ReviewTayo saves your study activity.</p>${[['google','Continue with Google','Sync progress across devices.'],['guest','Continue as guest','Keep progress on this device.']].map(([v,t,x])=>`<button class="ob-choice ${d.account===v?'sel':''}" onclick="d.account='${v}';renderOb()"><div><div class="lead">${t}</div><small>${x}</small></div><span class="mark">${d.account===v?'✓':''}</span></button>`).join('')}`;
if(ob===1)body=`<h1 class="ob-title serif">Which CSE level are you taking?</h1><p class="ob-copy">We'll match your subjects and mock exams.</p>${[['Professional','Analytical Ability · 170-item mock'],['Sub-Professional','Clerical Ability · 165-item mock']].map(([v,x])=>`<button class="ob-choice ${d.level===v?'sel':''}" onclick="d.level='${v}';renderOb()"><div><div class="lead">${v}</div><small>${x}</small></div><span class="mark">${d.level===v?'✓':''}</span></button>`).join('')}`;
if(ob===2)body=`<h1 class="ob-title serif">Where should we start?</h1><p class="ob-copy">Pick what sounds closest to you.</p>${[['beginner','Just starting','Build the basics first.'],['reviewing','Reviewing','Find and strengthen weak areas.'],['practice','Practice-ready','Focus on drills and mock exams.']].map(([v,t,x])=>`<button class="ob-choice ${d.start===v?'sel':''}" onclick="d.start='${v}';renderOb()"><div><div class="lead">${t}</div><small>${x}</small></div><span class="mark">${d.start===v?'✓':''}</span></button>`).join('')}<label class="form-label">Exam date <span style="float:right;text-transform:none;letter-spacing:0;font-weight:500">Optional</span></label><input class="field" type="date" value="${d.examDate}" onchange="d.examDate=this.value">`;
if(ob===3)body=`<h1 class="ob-title serif">When can you usually study?</h1><p class="ob-copy">We'll build your week around your schedule.</p><div class="eyebrow">Study days</div><div class="daygrid">${DAYS.map((x,i)=>`<button class="day ${d.studyDays.includes(i)?'sel':''}" onclick="toggleObDay(${i})">${x}</button>`).join('')}</div><div class="eyebrow">Typical session <span style="float:right;text-transform:none;letter-spacing:0;font-weight:500">Optional</span></div><div class="goalgrid" style="margin-top:10px">${[['Quick','10–15 min'],['Regular','20–30 min'],['Long','45+ min']].map(([v,x])=>`<button class="goal ${d.session===v?'sel':''}" onclick="d.session='${v}';renderOb()"><strong>${v}</strong><small>${x}</small></button>`).join('')}</div>`;
if(ob===4)body=`<h1 class="ob-title serif">What feels doable most days?</h1><p class="ob-copy">Choose a daily question goal. You can change it anytime.</p><div class="goalgrid">${[[5,'3–5 min'],[10,'5–10 min'],[20,'10–15 min']].map(([n,x])=>`<button class="goal ${d.goal===n?'sel':''}" onclick="d.goal=${n};renderOb()"><b>${n}</b><small>questions<br>${x}</small></button>`).join('')}</div><button class="row" style="margin-top:10px" onclick="customObGoal()"><b>Custom goal</b><span class="chev">›</span></button>`;
if(ob===5)body=`<h1 class="ob-title serif">Here's your study plan</h1><p class="ob-copy">Review anything you'd like to change.</p><div class="plan-card"><div class="planline"><span>CSE level</span><b>${d.level}</b></div><div class="planline"><span>Starting point</span><b>${obStartLabel(d.start)}</b></div><div class="planline"><span>Study days</span><b>${obDaysLabel(d.studyDays)}</b></div><div class="planline"><span>Daily goal</span><b>${d.goal} questions</b></div><div class="planline"><span>Session</span><b>${d.session||'Flexible'}</b></div><div class="planline"><span>Exam date</span><b>${d.examDate||'Not set'}</b></div></div><div class="first-card">${owl(46,'20 8 160 145')}<div><small>YOUR FIRST ACTIVITY</small><b>${d.start==='beginner'?'Foundation diagnostic':d.start==='practice'?'Smart Drill':'Verbal Ability diagnostic'}</b><small>${Math.min(d.goal,10)} questions · ~10 min</small></div></div><button class="ghost" onclick="ob=1;renderOb()">Adjust plan</button>`;
if(ob===6)body=`<h1 class="ob-title serif">Make it yours</h1><p class="ob-copy">A few optional preferences before you begin.</p><div class="eyebrow">Appearance</div><div class="theme-seg">${['device','light','dark'].map(x=>`<button class="${d.appearance===x?'sel':''}" onclick="d.appearance='${x}';previewObTheme('${x}');renderOb()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="eyebrow" style="margin-top:22px">Text size</div><div class="plan-card" style="margin-top:8px"><span style="font-size:${d.textSize==='large'?'18px':d.textSize==='extra'?'21px':'16px'}">Plentiful means available in large amounts.</span></div><div class="theme-seg">${[['standard','Standard'],['large','Large'],['extra','Extra Large']].map(([v,t])=>`<button class="${d.textSize===v?'sel':''}" onclick="d.textSize='${v}';renderOb()">${t}</button>`).join('')}</div><div class="eyebrow" style="margin-top:22px">Study reminders</div><p style="color:var(--mute);margin:6px 0 10px">Build the habit with a reminder on your study days.</p><div class="two"><button class="${d.reminders?'got':'again'}" onclick="d.reminders=true;renderOb()">Enable reminders</button><button class="${!d.reminders?'got':'again'}" onclick="d.reminders=false;renderOb()">Not now</button></div>`;
if(ob===7)body=`<div class="center" style="margin-top:8px">${owl(126,'0 0 200 220')}<h1 class="ob-title serif" style="font-size:38px;margin-top:8px">You're all set!</h1><p class="ob-copy" style="margin-bottom:12px">Your CSE study plan is ready.</p><div class="ob-stats"><span class="ob-stat">${d.level}</span><span class="ob-stat">${d.goal} / day</span><span class="ob-stat">${d.studyDays.length||'Flexible'} study days</span></div></div><div class="first-card"><div><small>FIRST UP</small><b>${d.start==='beginner'?'Foundation diagnostic':d.start==='practice'?'Smart Drill':'Verbal Ability diagnostic'}</b><small>${Math.min(d.goal,10)} questions · ~10 min</small></div></div><p style="text-align:center;color:var(--mute);font-size:12px;margin-top:14px">${d.account==='guest'?'Saved on this device. Create an account later to sync.':'Progress sync is ready.'}</p>`;
const primary=ob===7?'Start my first practice →':'Continue →';const secondary=(ob===3||ob===6)?'<button class="ghost" onclick="ob++;renderOb()">Skip</button>':ob===7?'<button class="ghost" onclick="commitOnboarding(false)">Explore Home</button>':'';
sheet(`<div class="onboard-shell">${obHeader()}<div class="ob-body">${body}</div><div class="ob-footer"><button class="cta mar" onclick="${ob===7?'commitOnboarding(true)':'ob++;renderOb()'}">${primary}</button>${secondary}</div></div>`)}
function toggleObDay(i){const a=obDraft.studyDays,j=a.indexOf(i);j>=0?a.splice(j,1):a.push(i);renderOb()}
function obDaysLabel(a){if(!a.length)return 'Flexible';return a.map(i=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]).join(' · ')}
function obStartLabel(v){return v==='beginner'?'Just starting':v==='practice'?'Practice-ready':'Reviewing'}
function customObGoal(){const n=prompt('Questions per day (5–50)',obDraft.goal);const v=Math.max(5,Math.min(50,+n||obDraft.goal));obDraft.goal=v;renderOb()}
function previewObTheme(mode){if(mode==='device')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',mode)}
function commitOnboarding(startPractice){const d=obDraft;S.level=d.level;S.goal=d.goal;S.start=obStartLabel(d.start);S.sched=obDaysLabel(d.studyDays);S.session=d.session||'Flexible';S.examDate=d.examDate;S.theme=d.appearance;S.reminders=d.reminders;applyTheme(S.theme);if(d.examDate){S.days=Math.max(0,Math.ceil((new Date(d.examDate+'T12:00:00')-new Date())/86400000))}sheet('');go('home');if(startPractice)setTimeout(()=>drill(),150)}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#sheet').className=='on'){sheet('');go(S.tab)}});
applyTheme(S.theme);go('home');
</script></body></html>
